name: Bug report
description: Report a reproducible Codex WebUI problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, cookies, API keys, private source code, or session data.
  - type: input
    id: version
    attributes:
      label: Versions
      description: Codex WebUI commit/release, Codex CLI version, Node.js version, browser, and OS.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
